  <script>
    // El motor de Flutter Web reescribe el viewport con `user-scalable=no`, que
    // impide hacer zoom en el navegador (WCAG 1.4.4). Lo devolvemos a un valor
    // que respeta el zoom cada vez que el motor lo cambie.
    (function () {
      var desired = 'width=device-width, initial-scale=1.0, maximum-scale=5.0';
      function normalize() {
        document.querySelectorAll('meta[name="viewport"]').forEach(function (meta) {
          if (meta.getAttribute('content') !== desired) {
            meta.setAttribute('content', desired);
          }
        });
      }
      new MutationObserver(normalize).observe(document.documentElement, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['content'],
      });
      normalize();
    })();
  </script>
