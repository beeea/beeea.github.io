name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # `vars.BASE_HREF` permite desplegar tanto en un dominio raíz
      # (https://beeea.github.io → "/") como en una página de proyecto
      # (https://beeea.github.io/beatriz-portfolio → "/beatriz-portfolio/").
      - run: flutter build web --release --tree-shake-icons --base-href "${{ vars.BASE_HREF || '/' }}"

      # GitHub Pages no reescribe las rutas de una SPA: copiar index.html como
      # 404.html deja que go_router resuelva enlaces profundos como /proyectos.
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
