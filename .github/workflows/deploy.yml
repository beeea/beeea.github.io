name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Version fija = misma que en local. Con `channel: stable` a secas el
          # runner instala el último stable (3.47.7), donde ThemeData.cardTheme
          # ya espera CardThemeData y el análisis falla. Igual que en
          # media_metadata_kit y estanteria.
          flutter-version: 3.27.2
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # El generador decide qué rutas existen y con qué metadatos: si se rompe,
      # los enlaces de los CVs vuelven a dar 404. Tiene sus propios tests.
      - run: python3 -m unittest discover -s tool -p "test_*.py"
      # `vars.BASE_HREF` permite desplegar tanto en un dominio raíz
      # (https://beeea.github.io → "/") como en una página de proyecto
      # (https://beeea.github.io/beatriz-portfolio → "/beatriz-portfolio/").
      - run: flutter build web --release --tree-shake-icons --base-href "${{ vars.BASE_HREF || '/' }}"

      # GitHub Pages no reescribe las rutas de una SPA: 404.html deja que
      # go_router resuelva rutas desconocidas, pero las conocidas necesitan un
      # index.html propio para responder 200 (los CVs apuntan a ellas) y para
      # no compartir el canonical de la portada. El script también marca el
      # 404 como noindex y saca las rutas de projects.json.
      - name: Generar rutas estáticas
        run: python3 tool/generate_routes.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Las URLs de abajo son las que usan los CVs. Si alguna deja de responder
      # 200, el deploy falla aquí en vez de descubrirlo en una candidatura.
      # Pages tarda unos segundos en propagar, de ahí los reintentos.
      - name: Comprobar las rutas públicas
        run: |
          check() {
            local url="$1" expected="$2"
            for intento in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
              if [ "$code" = "$expected" ]; then
                echo "$code $url"
                return 0
              fi
              sleep 5
            done
            echo "::error::$url devuelve $code y se esperaba $expected"
            return 1
          }

          check "https://beeea.github.io/" 200
          check "https://beeea.github.io/proyectos/" 200
          check "https://beeea.github.io/proyectos/estanteria/" 200
          check "https://beeea.github.io/proyectos/media-metadata-kit/" 200
          check "https://beeea.github.io/sobre-mi/" 200
          check "https://beeea.github.io/contacto/" 200
          check "https://beeea.github.io/no-existe/" 404
