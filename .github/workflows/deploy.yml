name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Version fija = misma que en local. Con `channel: stable` a secas el
          # runner instala el último stable (3.47.7), donde ThemeData.cardTheme
          # ya espera CardThemeData y el análisis falla. Igual que en
          # media_metadata_kit y estanteria.
          flutter-version: 3.27.2
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # `vars.BASE_HREF` permite desplegar tanto en un dominio raíz
      # (https://beeea.github.io → "/") como en una página de proyecto
      # (https://beeea.github.io/beatriz-portfolio → "/beatriz-portfolio/").
      - run: flutter build web --release --tree-shake-icons --base-href "${{ vars.BASE_HREF || '/' }}"

      # GitHub Pages no reescribe las rutas de una SPA: copiar index.html como
      # 404.html deja que go_router resuelva enlaces profundos como /proyectos.
      # Pero el código HTTP sigue siendo 404, y los CVs apuntan a esas rutas:
      # un validador de enlaces las marcaría como rotas. Generamos un index.html
      # por ruta conocida para que respondan 200. Las de proyecto salen del
      # JSON, así que una ficha nueva no se queda sin stub.
      - run: cp build/web/index.html build/web/404.html

      - name: Generar rutas estáticas
        run: |
          python3 - <<'PY'
          import json, pathlib

          build = pathlib.Path("build/web")
          index = (build / "index.html").read_text()
          routes = {"/proyectos", "/sobre-mi", "/contacto"}
          projects = json.loads(pathlib.Path("assets/raw/projects.json").read_text())
          routes |= {f"/proyectos/{p['slug']}" for p in projects["projects"]}

          for route in sorted(routes):
              target = build / route.lstrip("/")
              target.mkdir(parents=True, exist_ok=True)
              (target / "index.html").write_text(index)

          print(f"{len(routes)} rutas con index.html propio")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
